name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
